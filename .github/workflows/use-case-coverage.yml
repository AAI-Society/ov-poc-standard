name: Use-case coverage index

on:
  push:
    paths:
      - 'docs/use-cases/**'
      - 'tools/generate_use_case_coverage.py'
  pull_request:
    paths:
      - 'docs/use-cases/**'
      - 'tools/generate_use_case_coverage.py'

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the coverage index matches the submissions
        run: python3 tools/generate_use_case_coverage.py --check
