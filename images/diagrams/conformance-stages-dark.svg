<svg xmlns="http://www.w3.org/2000/svg" width="960" height="290" viewBox="0 0 960 290" font-family="Montserrat,'Source Sans 3',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
<rect x="20" y="40" width="270" height="120" rx="10" fill="#161616" stroke="#2e2e2e" stroke-width="1.5"/>
<text x="155.0" y="79.0" font-size="14.5" fill="#f0edea" font-weight="600" text-anchor="middle">Self-Declared</text>
<text x="155.0" y="96.0" font-size="12" fill="#8f8a82" text-anchor="middle">operator publishes a</text>
<text x="155.0" y="113.0" font-size="12" fill="#8f8a82" text-anchor="middle">standardized statement</text>
<text x="155.0" y="130.0" font-size="11" fill="#cfff04" font-weight="600" text-anchor="middle">C10.1</text>
<rect x="345" y="40" width="270" height="120" rx="10" fill="#161616" stroke="#2e2e2e" stroke-width="1.5"/>
<text x="480.0" y="79.0" font-size="14.5" fill="#f0edea" font-weight="600" text-anchor="middle">Third-Party Assessed</text>
<text x="480.0" y="96.0" font-size="12" fill="#8f8a82" text-anchor="middle">accredited assessor examines</text>
<text x="480.0" y="113.0" font-size="12" fill="#8f8a82" text-anchor="middle">and confirms conformance</text>
<text x="480.0" y="130.0" font-size="11" fill="#f0edea" text-anchor="middle"></text>
<rect x="670" y="40" width="270" height="120" rx="10" fill="#161616" stroke="#2e2e2e" stroke-width="1.5"/>
<text x="805.0" y="79.0" font-size="14.5" fill="#f0edea" font-weight="600" text-anchor="middle">Continuously Monitored</text>
<text x="805.0" y="96.0" font-size="12" fill="#8f8a82" text-anchor="middle">every in-scope action validated</text>
<text x="805.0" y="113.0" font-size="12" fill="#8f8a82" text-anchor="middle">as it occurs</text>
<text x="805.0" y="130.0" font-size="11" fill="#cfff04" font-weight="600" text-anchor="middle">C10.3</text>
<line x1="290" y1="100" x2="343" y2="100" stroke="#8f8a82" stroke-width="1.5"/>
<polygon points="343,100 334,95 334,105" fill="#8f8a82"/>
<line x1="615" y1="100" x2="668" y2="100" stroke="#8f8a82" stroke-width="1.5"/>
<polygon points="668,100 659,95 659,105" fill="#8f8a82"/>
<rect x="170" y="212" width="620" height="48" rx="10" fill="#1d1c1a" stroke="#6e6a63" stroke-width="1.5"/>
<text x="480.0" y="240.5" font-size="12.5" fill="#b5b0a8" font-weight="600" text-anchor="middle">Trust-assumption disclosure — C10.2 · required at every stage</text>
