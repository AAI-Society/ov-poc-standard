<text x="390.0" y="157.5" font-size="14.5" fill="#aff5b4" font-weight="600" text-anchor="middle">Tier 3 — Independently Verifiable</text>
<text x="390.0" y="174.5" font-size="12" fill="#aff5b4" text-anchor="middle">trust: the mathematics — anyone can check</text>
<text x="390.0" y="191.5" font-size="12" fill="#aff5b4" font-weight="600" text-anchor="middle">✓ Proof-of-Control</text>
