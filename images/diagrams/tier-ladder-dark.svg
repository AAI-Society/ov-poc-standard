<text x="390.0" y="434.5" font-size="12" fill="#ffa198" text-anchor="middle">trust: the operator's word</text>
<text x="390.0" y="451.5" font-size="12" fill="#ffa198" font-weight="600" text-anchor="middle">✕ not Proof-of-Control</text>
