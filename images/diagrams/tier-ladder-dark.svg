<text x="390.0" y="51.5" font-size="14.5" fill="#79c0ff" font-weight="600" text-anchor="middle">Tier 4 — Self-Enforcing</text>
<text x="390.0" y="68.5" font-size="12" fill="#79c0ff" text-anchor="middle">trust: no one — cannot run if integrity breaks</text>
<text x="390.0" y="85.5" font-size="12" fill="#79c0ff" font-weight="600" text-anchor="middle">✓ Proof-of-Control</text>
