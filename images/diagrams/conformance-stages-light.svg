<text x="805.0" y="96.0" font-size="12" fill="#57606a" text-anchor="middle">every in-scope action validated</text>
<text x="805.0" y="113.0" font-size="12" fill="#57606a" text-anchor="middle">as it occurs</text>
<text x="805.0" y="130.0" font-size="11" fill="#6f42c1" font-weight="600" text-anchor="middle">C10.3</text>
