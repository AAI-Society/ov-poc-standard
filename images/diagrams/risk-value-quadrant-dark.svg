<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" font-family="Montserrat,'Source Sans 3',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
<text x="370" y="24" font-size="14" fill="#f0edea" font-weight="600" text-anchor="middle">The agent risk-to-value bind</text>
<rect x="114" y="44" width="252" height="147" rx="8" fill="#2a1214" stroke="#ff6568" stroke-width="1.5"/>
<text x="240.0" y="113.5" font-size="14" fill="#ff9a9c" font-weight="600" text-anchor="middle">Failed deployment</text>
<text x="240.0" y="130.5" font-size="11.5" fill="#ff9a9c" text-anchor="middle"></text>
<rect x="374" y="44" width="252" height="147" rx="8" fill="#1d1c1a" stroke="#6e6a63" stroke-width="1.5"/>
<text x="500.0" y="113.5" font-size="14" fill="#b5b0a8" font-weight="600" text-anchor="middle">Unleash</text>
<text x="500.0" y="130.5" font-size="11.5" fill="#b5b0a8" text-anchor="middle">value, but unquantifiable risk</text>
<rect x="114" y="199" width="252" height="147" rx="8" fill="#161616" stroke="#2e2e2e" stroke-width="1.5"/>
<text x="240.0" y="268.5" font-size="14" fill="#8f8a82" font-weight="600" text-anchor="middle">Constrain</text>
<text x="240.0" y="285.5" font-size="11.5" fill="#8f8a82" text-anchor="middle">safe, but can't do the job</text>
<rect x="374" y="199" width="252" height="147" rx="8" fill="#222b00" stroke="#cfff04" stroke-width="1.5"/>
<text x="500.0" y="268.5" font-size="14" fill="#e3ff66" font-weight="600" text-anchor="middle">Proof-of-Control</text>
<text x="500.0" y="285.5" font-size="11.5" fill="#e3ff66" text-anchor="middle">value up, risk down</text>
<text x="85" y="58" font-size="11.5" fill="#8f8a82" text-anchor="end">High</text>
<text x="85" y="72" font-size="11.5" fill="#8f8a82" text-anchor="end">risk</text>
<text x="85" y="320" font-size="11.5" fill="#8f8a82" text-anchor="end">Low</text>
<text x="85" y="334" font-size="11.5" fill="#8f8a82" text-anchor="end">risk</text>
<text x="150" y="378" font-size="11.5" fill="#8f8a82" text-anchor="middle">Low value</text>
<text x="590" y="378" font-size="11.5" fill="#8f8a82" text-anchor="middle">High value</text>
<line x1="50" y1="350" x2="50" y2="40" stroke="#8f8a82" stroke-width="1.5"/>
<polygon points="50,40 45,49 55,49" fill="#8f8a82"/>
<line x1="110" y1="396" x2="630" y2="396" stroke="#8f8a82" stroke-width="1.5"/>
<polygon points="630,396 621,391 621,401" fill="#8f8a82"/>
</svg>
